name: Create and Publish Release

on:
  workflow_dispatch: # Allows manual runs from the Actions tab
    inputs:
      run_all_tests:
        description: 'Run all tests (including slow network tests)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          # By default (on tag push), run only fast tests to keep releases quick.
          # For manual workflow_dispatch runs, respect the 'run_all_tests' input.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_all_tests }}" == "true" ]]; then
            echo "Running all tests (including network) as requested..."
            pytest
          else
            echo "Running fast, local-only tests..."
            pytest -m "not network"
          fi

      - name: Build and package application
        run: python build_exe.py --package --smoke-test

      - name: Get release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/') # Only run for tag pushes
        id: get_release_notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $changelog = Get-Content -Path "CHANGELOG.md" -Raw
          $pattern = "(?s)(?<=## v$version\s*).*?(?=\s*## v|\Z)"
          $notes = [regex]::Match($changelog, $pattern).Value.Trim()

          if ([string]::IsNullOrEmpty($notes)) {
            echo "::warning::Could not find release notes for v$version in CHANGELOG.md. Release body will be empty."
            $notes = "No release notes found for this version."
          }

          # Write notes to a file to be used by gh release create, which is safer than passing a multiline string.
          $notes | Out-File -FilePath "releasenotes.md" -Encoding utf8

      - name: Create and Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/') # Only run for tag pushes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} `
            --title "${{ github.ref_name }}" `
            --notes-file "releasenotes.md" `
            "release/OwlcatPortraitTool-${{ github.ref_name }}-windows.zip" `
            "release/SHA256SUMS.txt"