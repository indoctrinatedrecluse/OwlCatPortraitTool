name: Create and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and package application
        run: python build_exe.py --package --smoke-test

      - name: Get release notes from CHANGELOG
        id: get_release_notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $changelog = Get-Content -Path "CHANGELOG.md" -Raw
          $pattern = "(?s)(?<=## v$version\s*).*?(?=\s*## v|\Z)"
          $notes = [regex]::Match($changelog, $pattern).Value.Trim()

          if ([string]::IsNullOrEmpty($notes)) {
            echo "::warning::Could not find release notes for v$version in CHANGELOG.md. Release body will be empty."
            $notes = "No release notes found for this version."
          }

          $delimiter = "NOTES_$(Get-Random)"
          echo "notes<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/OwlcatPortraitTool-${{ github.ref_name }}-windows.zip
            release/SHA256SUMS.txt
          body: ${{ steps.get_release_notes.outputs.notes }}